:root {
  --background: #f6f4ee;
  --foreground: #16251c;
  --card: #ffffff;
  --card-foreground: #16251c;
  --muted: #efece3;
  --muted-foreground: #5d695f;
  --border: #e5e1d5;
  --input: #d8d3c5;
  --ring: #1a8a4c;
  --primary: #1a8a4c;
  --primary-hover: #15733f;
  --primary-foreground: #ffffff;
  --primary-soft: #e6f4ea;
  --ink: #12291b;
  --ink-foreground: #e9efe6;
  --accent: #d99a1e;
  --accent-soft: #fbf0d6;
  --ok: #1a8a4c;
  --ok-soft: #e6f4ea;
  --warn: #9a5b06;
  --warn-soft: #fbf0d6;
  --risk: #b42318;
  --risk-soft: #fcebe8;
  --wait: #355c86;
  --wait-soft: #e7eef6;
  --radius: 12px;
  --frame: var(--background);
  --side-bg: #fbfaf6;
  --side-fg: #16251c;
  --side-muted: #6b746c;
  --side-item: #3d4a41;
  --side-hover: #f2f0e8;
  --side-active-bg: #e6f4ea;
  --side-active-fg: #15733f;
  --side-line: #e5e1d5;
  --logo-bg: #1a8a4c;
  --logo-fg: #ffffff;
}
@layer base {
  * {
    border-color: var(--border);
  }
  html {
    -webkit-font-smoothing: antialiased;
  }
  body {
    background: var(--frame);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-feature-settings: "cv11", "ss01";
  }
  :focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }
  dialog::backdrop {
    background: rgb(18 41 27 / 0.4);
  }
}
html {
  scrollbar-gutter: stable;
}
*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background-color: transparent;
  border: 3px solid transparent;
  border-radius: 999px;
  background-clip: padding-box;
}
.show-scrollbar *::-webkit-scrollbar-thumb, .show-scrollbar::-webkit-scrollbar-thumb {
  background-color: rgb(24 33 28 / 0.22);
}
*::-webkit-scrollbar-thumb:hover {
  background-color: rgb(24 33 28 / 0.38);
}
@supports not selector(::-webkit-scrollbar) {
  * {
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
  }
  .show-scrollbar, .show-scrollbar * {
    scrollbar-color: rgb(24 33 28 / 0.25) transparent;
  }
}
